<!DOCTYPE html>
<html>
<head><title>Converting...</title></head>
<body>
<canvas id="c" width="400" height="400" style="display:none"></canvas>
<p id="msg" style="font-family:sans-serif;text-align:center;margin-top:40px;font-size:18px">변환 중...</p>
<script>
const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0d0d1a"/>
    </radialGradient>
    <linearGradient id="gClaude" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="gGPT" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="gGemini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gGrok" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="200" cy="200" r="200"/>
    </clipPath>
  </defs>
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>
  <path d="M200,200 L60,60 A198,198 0 0,1 200,2 Z" fill="url(#gClaude)" opacity="0.85" clip-path="url(#circle)"/>
  <path d="M200,200 L200,2 A198,198 0 0,1 340,60 Z" fill="url(#gGPT)" opacity="0.85" clip-path="url(#circle)"/>
  <path d="M200,200 L340,340 A198,198 0 0,1 200,398 Z" fill="url(#gGemini)" opacity="0.85" clip-path="url(#circle)"/>
  <path d="M200,200 L200,398 A198,198 0 0,1 60,340 Z" fill="url(#gGrok)" opacity="0.85" clip-path="url(#circle)"/>
  <line x1="2" y1="2" x2="398" y2="398" stroke="#0d0d1a" stroke-width="3" clip-path="url(#circle)"/>
  <line x1="398" y1="2" x2="2" y2="398" stroke="#0d0d1a" stroke-width="3" clip-path="url(#circle)"/>
  <circle cx="200" cy="200" r="80" fill="#0d0d1a"/>
  <circle cx="200" cy="200" r="76" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>
  <text x="200" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff" letter-spacing="-1">AI</text>
  <text x="200" y="222" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="400" fill="#ffffff" opacity="0.6" letter-spacing="4">FACTION</text>
  <circle cx="200" cy="200" r="196" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
</svg>`;

const img = new Image();
const blob = new Blob([svg], {type: 'image/svg+xml'});
const url = URL.createObjectURL(blob);
img.onload = function() {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0);
  URL.revokeObjectURL(url);
  const a = document.createElement('a');
  a.download = 'ai-faction-profile.jpg';
  a.href = canvas.toDataURL('image/jpeg', 0.95);
  a.click();
  document.getElementById('msg').textContent = '✅ 다운로드 완료! ai-faction-profile.jpg 저장됐어요.';
};
img.src = url;
</script>
</body>
</html>
