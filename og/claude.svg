<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0F"/>
      <stop offset="100%" style="stop-color:#13131A"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C17CE4"/>
      <stop offset="100%" style="stop-color:#E0AAFF"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>
  <!-- Large glow circle -->
  <circle cx="940" cy="315" r="220" fill="#C17CE4" opacity="0.18"/>
  <!-- Badge -->
  <rect x="60" y="60" width="220" height="36" rx="18" fill="none" stroke="#333350" stroke-width="1.5"/>
  <text x="170" y="83" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#8888AA" text-anchor="middle" letter-spacing="2">WHICH AI HOUSE?</text>
  <!-- Emoji inside circle -->
  <text x="940" y="345" font-family="-apple-system,sans-serif" font-size="140" text-anchor="middle" dominant-baseline="middle">🟣</text>
  <!-- Main title lines -->
  <text x="60" y="200" font-family="-apple-system,sans-serif" font-size="56" font-weight="700" fill="#FFFFFF" text-anchor="start">당신의 AI 하우스는</text>
  <text x="60" y="300" font-family="-apple-system,sans-serif" font-size="80" font-weight="900" fill="#C17CE4" text-anchor="start">Claude 하우스</text>
  <!-- Short tagline -->
  <text x="60" y="366" font-family="-apple-system,sans-serif" font-size="28" fill="#8888AA" text-anchor="start">사색형 창작자</text>
  <!-- Long tagline first line -->
  <text x="60" y="414" font-family="-apple-system,sans-serif" font-size="22" fill="#8888AA" text-anchor="start">당신은 깊이 생각하고 신중하게 말합니다.</text>
  <!-- Bottom URL -->
  <text x="60" y="600" font-family="-apple-system,sans-serif" font-size="18" fill="#555570" text-anchor="start">ai-faction-quiz.vercel.app</text>
</svg>
