<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0F"/>
      <stop offset="100%" style="stop-color:#13131A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#C17CE4;stop-opacity:0.6"/>
      <stop offset="33%" style="stop-color:#10A37F;stop-opacity:0.6"/>
      <stop offset="66%" style="stop-color:#4285F4;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#E7425D;stop-opacity:0.6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Top accent line -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#glow)"/>
  <!-- House circles -->
  <circle cx="200" cy="200" r="120" fill="#C17CE4" opacity="0.08"/>
  <circle cx="1000" cy="430" r="150" fill="#E7425D" opacity="0.08"/>
  <!-- Badge -->
  <rect x="460" y="120" width="280" height="36" rx="18" fill="none" stroke="#333350" stroke-width="1.5"/>
  <text x="600" y="143" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#8888AA" text-anchor="middle" letter-spacing="2">WHICH AI HOUSE?</text>
  <!-- Main title -->
  <text x="600" y="260" font-family="-apple-system,sans-serif" font-size="68" font-weight="900" fill="#FFFFFF" text-anchor="middle">당신의 AI는</text>
  <text x="600" y="340" font-family="-apple-system,sans-serif" font-size="68" font-weight="900" fill="#FFFFFF" text-anchor="middle">당신을 닮았다</text>
  <!-- Subtitle -->
  <text x="600" y="410" font-family="-apple-system,sans-serif" font-size="24" fill="#8888AA" text-anchor="middle">8문항으로 당신의 AI 하우스를 찾아보세요</text>
  <!-- Faction chips -->
  <rect x="160" y="470" width="190" height="60" rx="12" fill="#1E1E2E" stroke="#3A2448" stroke-width="1.5"/>
  <text x="255" y="496" font-family="-apple-system,sans-serif" font-size="18" fill="#C17CE4" text-anchor="middle" font-weight="700">🟣 Claude</text>
  <text x="255" y="516" font-family="-apple-system,sans-serif" font-size="13" fill="#8888AA" text-anchor="middle">사색형 창작자</text>
  <rect x="370" y="470" width="190" height="60" rx="12" fill="#1E1E2E" stroke="#0D3D2E" stroke-width="1.5"/>
  <text x="465" y="496" font-family="-apple-system,sans-serif" font-size="18" fill="#10A37F" text-anchor="middle" font-weight="700">🟢 GPT</text>
  <text x="465" y="516" font-family="-apple-system,sans-serif" font-size="13" fill="#8888AA" text-anchor="middle">실행형 만능인</text>
  <rect x="580" y="470" width="190" height="60" rx="12" fill="#1E1E2E" stroke="#1A2F5A" stroke-width="1.5"/>
  <text x="675" y="496" font-family="-apple-system,sans-serif" font-size="18" fill="#4285F4" text-anchor="middle" font-weight="700">🔵 Gemini</text>
  <text x="675" y="516" font-family="-apple-system,sans-serif" font-size="13" fill="#8888AA" text-anchor="middle">체계형 전략가</text>
  <rect x="790" y="470" width="190" height="60" rx="12" fill="#1E1E2E" stroke="#4A1820" stroke-width="1.5"/>
  <text x="885" y="496" font-family="-apple-system,sans-serif" font-size="18" fill="#E7425D" text-anchor="middle" font-weight="700">🔴 Grok</text>
  <text x="885" y="516" font-family="-apple-system,sans-serif" font-size="13" fill="#8888AA" text-anchor="middle">반골형 혁신가</text>
  <!-- Bottom URL -->
  <text x="600" y="600" font-family="-apple-system,sans-serif" font-size="18" fill="#555570" text-anchor="middle">ai-faction-quiz.vercel.app</text>
</svg>
