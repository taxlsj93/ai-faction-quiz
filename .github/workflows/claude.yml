name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, synchronize]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  # @claude 멘션 시 대화식 응답 (PR 코멘트, 이슈 코멘트)
  claude-interactive:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # @claude 멘션 자동 감지

  # PR 오픈 시 자동 코드 리뷰
  claude-pr-review:
    if: github.event_name == 'pull_request' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            이 PR을 리뷰해주세요. 다음 기준으로 확인하세요:
            1. 버그 또는 로직 오류
            2. 보안 취약점 (XSS, CSRF 등)
            3. Vercel 배포에 영향을 줄 수 있는 변경사항
            4. 광고/어필리에이트 링크 정확성 (aifaction 파라미터 등)
            5. 한국어 카피 자연스러움
            결과는 한국어로 PR 코멘트로 남겨주세요.
          claude_args: "--max-turns 8"

  # 'ai-pr' 레이블 붙은 이슈 → 자동 구현 + PR 생성
  claude-auto-implement:
    if: github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'ai-pr'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            이 GitHub 이슈의 요구사항을 구현하고 PR을 만들어주세요.
            - CLAUDE.md의 코딩 컨벤션을 따르세요
            - Vercel 배포 호환성 유지
            - 변경사항에 대한 간결한 PR 설명 작성
          claude_args: "--max-turns 15"
